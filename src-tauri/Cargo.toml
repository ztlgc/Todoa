[package]
name = "todoa"
version = "1.0.1"
description = "Todoa Windows desktop app"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "todoa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
serde_json = "1.0.151"
same-file = "1.0.6"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Explicit debug-only native fault injection. Never enabled by default.
test-tray-failure = []
test-restore-startup-failure = []

[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
tauri-plugin-sql = { path = "vendor/tauri-plugin-sql" }
tauri-plugin-autostart = { path = "vendor/tauri-plugin-autostart" }
