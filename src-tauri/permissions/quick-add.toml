[[permission]]
identifier = "main-show-quick-add"
description = "Main may show and focus the existing Quick Add window."
commands.allow = ["show_quick_add"]

[[permission]]
identifier = "quick-create-task"
description = "Quick Add may create validated Inbox tasks with optional dates, recurrence and reminders."
commands.allow = ["create_quick_task", "create_quick_scheduled_task"]

[[permission]]
identifier = "quick-hide-window"
description = "Quick Add may hide its own existing window."
commands.allow = ["hide_quick_add"]
