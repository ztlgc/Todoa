[[permission]]
identifier = "main-journal-export"
description = "Main may export journal Markdown through the native save dialog."
commands.allow = ["export_journal_markdown"]

[[permission]]
identifier = "main-journal-follow-up"
description = "Main may create a follow-up task linked atomically to a saved journal item."
commands.allow = ["create_journal_follow_up"]

[[permission]]
identifier = "main-journal-automation"
description = "Main may reconcile available task completion snapshots into daily journals."
commands.allow = ["reconcile_journal_tasks"]

[[permission]]
identifier = "main-journal-content"
description = "Main may save journal content and access its own local images."
commands.allow = ["save_journal_content", "import_journal_image", "read_journal_image", "prune_journal_images"]

[[permission]]
identifier = "main-journal-review"
description = "Main may manage highlight snapshots and atomically append review materials."
commands.allow = ["list_journal_highlights", "save_journal_highlight", "remove_journal_highlight", "add_journal_review_material", "journal_review_materials"]
